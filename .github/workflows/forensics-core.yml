name: DFIR Core Tests

on:
  push:
    branches:
      - feature/digital-forensics-toolbox
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/forensics.core.test.mjs
